<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Kukirin Key</title>
<style>

</head>
<body>
<div class="box">

</div>
<script>
'use strict';
(function(){
var P=[75,117,107,105,114,105,110,95,50,48,50,53,95,83,65,76,84,33];

function F(s){var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return String(h).padStart(2,"0")+"h "+String(m).padStart(2,"0")+"m "+String(x).padStart(2,"0")+"s"}
var kE=document.getElementById("key"),tE=document.getElementById("timer"),nE=document.getElementById("note"),cB=document.getElementById("copyBtn"),tI=null,cK="";
function S1(){if(tI){clearInterval(tI);tI=null}}

function G(u){var i=Math.floor(Date.now()/1000),k="KEY-"+i+"-"+T(u),e=i+L;try{localStorage.setItem(K,JSON.stringify({u:u,k:k,i:i,e:e}))}catch(x){}cK=k;kE.textContent=k;E1();var tk=function(){var l=e-Math.floor(Date.now()/1000);if(l<=0){tE.textContent="KEY EXPIRED — refresh";tE.style.color="#ff6e82";S1();return}tE.textContent="left: "+F(l)};tk();tI=setInterval(tk,1000)}
var u=V(new URLSearchParams(location.search).get("uid"));
if(u){var c=null;try{c=JSON.parse(localStorage.getItem(K)||"null");if(c&&c.u===u&&c.e>Math.floor(Date.now()/1000)&&c.k==="KEY-"+c.i+"-"+T(u)){cK=c.k;kE.textContent=c.k;E1();var tk2=function(){var l=c.e-Math.floor(Date.now()/1000);if(l<=0){tE.textContent="KEY EXPIRED";tE.style.color="#ff6e82";S1();return}tE.textContent="left: "+F(l)};tk2();tI=setInterval(tk2,1000)}else G(u)}catch(x){G(u)}}
else{kE.textContent="ACCESS DENIED";tE.textContent="";D1();nE.textContent="No valid uid token. Open this page via GET KEY button in the game."}
cB.addEventListener("click",function(){if(cB.disabled||!cK)return;var d=function(o){if(o){cB.textContent="COPIED!";nE.textContent="Copied: "+cK;setTimeout(function(){cB.textContent="COPY KEY"},1500)}else nE.textContent="Copy failed: "+cK};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(cK).then(function(){d(true)},function(){var ta=document.createElement("textarea");ta.value=cK;ta.style.cssText="position:fixed;opacity:0;font-size:16px";ta.setAttribute("readonly","");document.body.appendChild(ta);ta.select();var o=false;try{o=document.execCommand("copy")}catch(x){}document.body.removeChild(ta);d(o)})}else{var ta=document.createElement("textarea");ta.value=cK;ta.style.cssText="position:fixed;opacity:0;font-size:16px";ta.setAttribute("readonly","");document.body.appendChild(ta);ta.select();var o=false;try{o=document.execCommand("copy")}catch(x){}document.body.removeChild(ta);d(o)}});
window.addEventListener("beforeunload",S1);
window.addEventListener("pagehide",S1);
})();
</script>
</body>
</html>
