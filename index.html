<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kukirin Key 8h</title>
<style>
body{background:#180f24;color:#ebe4f5;font-family:monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;margin:0}
.box{background:#241036;padding:32px;border-radius:14px;border:2px solid #ff8c3c;text-align:center;max-width:460px;width:90%}
h1{color:#ffb478;font-size:19px;margin:0 0 10px}
#key{font-size:16px;letter-spacing:1px;background:#100a18;padding:14px;border-radius:8px;margin:14px 0;word-break:break-all}
#timer{color:#6effa2;font-size:14px;margin-bottom:12px}
button{background:#ff5e00;color:#fff;border:0;padding:12px 26px;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer}
small{color:#9488a8;display:block;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h1>KUKIRIN AUTOPILOT — KEY 8H</h1>
<div>Твой личный ключ:</div>
<div id="key">...</div>
<div id="timer"></div>
<button id="copyBtn">COPY KEY</button>
<small id="note">Ключ живёт 8 часов с момента открытия этой страницы и привязан к твоему UID.</small>
</div>
<script>
'use strict';
(function(){

var SALT = String.fromCharCode(75,117,107,105,114,105,110,95,50,48,50,53,95,83,65,76,84,33);
var LIFE = 8 * 3600;
var SKEW = 300;
var STORAGE_KEY = "kukirin_key_cache_big";

function hashOf(s){
    var h = 0;
    for (var i = 0; i < s.length; i++){
        h = (h * 31 + s.charCodeAt(i)) % 100000000;
    }
    return h;
}
function keyBody(uid, issue){
    var b = "";
    for (var r = 1; r <= 4; r++){
        b += String(hashOf(uid + "_" + issue + "_" + SALT + "_" + r)).padStart(8, "0");
    }
    return b;
}
function validateUid(uid){
    if (!uid) return null;
    uid = uid.trim();
    if (uid.length === 0 || uid.length > 32) return null;
    if (!/^[a-zA-Z0-9_-]+$/.test(uid)) return null;
    return uid;
}
function nowSec(){ return Math.floor(Date.now() / 1000); }
function formatTime(sec){
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return String(h).padStart(2,"0") + "ч " + String(m).padStart(2,"0") + "м " + String(s).padStart(2,"0") + "с";
}

function loadCached(uid){
    try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        var d = JSON.parse(raw);
        if (typeof d !== "object" || d === null) return null;
        if (d.uid !== uid) return null;
        if (typeof d.key !== "string" || typeof d.issue !== "number" || typeof d.expireAt !== "number") return null;
        var now = nowSec();
        if (d.issue > now + SKEW) return null;
        if (now >= d.expireAt) return null;
        if (d.key !== "KEY-" + d.issue + "-" + keyBody(uid, d.issue)) return null;
        return d;
    } catch(e){ return null; }
}
function saveCached(uid, key, issue, expireAt){
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ uid: uid, key: key, issue: issue, expireAt: expireAt }));
    } catch(e){}
}
function clearCached(){
    try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
}

var keyEl = document.getElementById("key");
var timerEl = document.getElementById("timer");
var noteEl = document.getElementById("note");
var copyBtn = document.getElementById("copyBtn");
var timerInterval = null;
var currentKeyText = "";

function stopTimer(){
    if (timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}
function disableCopy(){
    copyBtn.disabled = true;
    copyBtn.style.opacity = "0.4";
    copyBtn.style.cursor = "not-allowed";
}

var uid = validateUid(new URLSearchParams(location.search).get("uid"));

if (!uid){
    keyEl.textContent = "НЕТ UID";
    timerEl.textContent = "";
    noteEl.textContent = "Открывай через кнопку GET KEY в игре — тогда в ссылке будет uid и ключ посчитается.";
    disableCopy();
} else {
    var cached = loadCached(uid);
    var issue, key, expireAt;
    if (cached){
        issue = cached.issue;
        key = cached.key;
        expireAt = cached.expireAt;
    } else {
        clearCached();
        issue = nowSec();
        key = "KEY-" + issue + "-" + keyBody(uid, issue);
        expireAt = issue + LIFE;
        saveCached(uid, key, issue, expireAt);
    }
    currentKeyText = key;
    keyEl.textContent = key;
    var tick = function(){
        var left = expireAt - nowSec();
        if (left <= 0){
            timerEl.textContent = "КЛЮЧ МЁРТВ — обнови страницу для нового";
            timerEl.style.color = "#ff6e82";
            stopTimer();
            return;
        }
        timerEl.textContent = "осталось: " + formatTime(left);
    };
    tick();
    timerInterval = setInterval(tick, 1000);
}

function fallbackCopy(t){
    var ta = document.createElement("textarea");
    ta.value = t;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    ta.style.fontSize = "16px";
    ta.setAttribute("readonly", "");
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, t.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch(e){ ok = false; }
    document.body.removeChild(ta);
    return ok;
}

copyBtn.addEventListener("click", function(){
    if (copyBtn.disabled) return;
    var t = currentKeyText;
    if (!t || t === "...") return;
    var done = function(ok){
        if (ok){
            copyBtn.textContent = "СКОПИРОВАНО!";
            noteEl.textContent = "Скопировано: " + t;
            setTimeout(function(){ copyBtn.textContent = "COPY KEY"; }, 1500);
        } else {
            noteEl.textContent = "Ошибка копирования, выдели текст вручную: " + t;
        }
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(
            function(){ done(true); },
            function(){ done(fallbackCopy(t)); }
        );
    } else {
        done(fallbackCopy(t));
    }
});

window.addEventListener("beforeunload", stopTimer);
window.addEventListener("pagehide", stopTimer);

})();
</script>
</body>
</html>
