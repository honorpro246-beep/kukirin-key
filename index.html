<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Kukirin Key 8h</title>
<style>
body{background:#180f24;color:#ebe4f5;font-family:monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;margin:0;user-select:none;-webkit-user-select:none}
.box{background:#241036;padding:26px 20px;border-radius:14px;border:2px solid #ff8c3c;text-align:center;max-width:440px;width:90%;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
h1{color:#ffb478;font-size:18px;margin:0 0 10px}
#key{font-size:14px;letter-spacing:1px;background:#100a18;padding:12px;border-radius:8px;margin:12px 0;word-break:break-all;user-select:all;-webkit-user-select:all;color:#6effa2;border:1px solid #4a286d}
#timer{color:#6effa2;font-size:14px;margin-bottom:12px}
button{background:#ff5e00;color:#fff;border:0;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;transition:background 0.2s,opacity 0.2s}
button:active{background:#e05300}
small{color:#9488a8;display:block;margin-top:10px;font-size:12px}

#inputArea{margin-top:14px;background:#190c27;padding:14px;border-radius:8px;border:1px solid #ff8c3c}
#manualInput{width:95%;padding:10px;background:#100a18;border:1px solid #ff8c3c;color:#ebe4f5;border-radius:6px;font-family:monospace;font-size:12px;outline:none;margin-bottom:10px;box-sizing:border-box}
#manualBtn{background:#5078ff;padding:10px 20px;font-size:13px}
</style>
</head>
<body>
<div class="box">
<h1>KUKIRIN AUTOPILOT — 8H KEY</h1>
<div id="subTitle">Your personal key:</div>

<div id="key">GENERATING...</div>
<div id="timer"></div>

<button id="copyBtn">COPY KEY</button>
<small id="note">Connecting to key system...</small>

<div id="inputArea" style="display:none">
    <div style="font-size:12px;color:#ffb478;margin-bottom:8px">Linkvertise lost parameters. Paste your GET KEY link OR enter your Roblox UserId:</div>
    <input type="text" id="manualInput" placeholder="Paste link or enter UserId (e.g. 123456789)">
    <br>
    <button id="manualBtn">GET 8H KEY</button>
</div>
</div>

<script>
'use strict';
(function(){
var _Z = [12,50,44,46,45,46,41,74,85,87,85,82,74,100,118,115,99,86];
var S = _Z.map(function(c){ return String.fromCharCode(c ^ 0x37); }).join("");

var LF = 28800;
var SK = 900;
var CK = "kukirin_uid_cache_v4";

function H(s){
    var h = 0;
    for(var i = 0; i < s.length; i++){
        h = (h * 31 + s.charCodeAt(i)) % 100000000;
    }
    return h;
}

function P8(n){ return String(n).padStart(8, "0"); }
function TB(u){ return P8(H(u + "_" + S + "_t1")) + P8(H(u + "_" + S + "_t2")) + P8(H(u + "_" + S + "_t3")); }
function KB(u, i){
    var b = "";
    for(var r = 1; r <= 4; r++){
        b += P8(H(u + "_" + i + "_" + S + "_r" + r));
    }
    return b;
}

function EU(r){
    if(!r) return null;
    try { r = decodeURIComponent(r); } catch(e){}
    r = String(r).trim();
    
    // Если вставили просто цифры UID игрока
    if(/^\d{3,15}$/.test(r)){
        return r;
    }
    
    // Если вставили ссылку или токен
    if(r.indexOf("uid=") !== -1){
        var matchUid = r.match(/uid=([^&]+)/);
        if(matchUid) r = matchUid[1];
    }
    var m = r.match(/^(\d{1,20})-(\d{24})$/);
    if(!m) return null;
    return TB(m[1]) === m[2] ? m[1] : null;
}

function NS(){ return Math.floor(Date.now() / 1000); }
function FM(s){
    if(s < 0) s = 0;
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return String(h).padStart(2, "0") + "h " + String(m).padStart(2, "0") + "m " + String(x).padStart(2, "0") + "s";
}

function LC(){
    try{
        var d = JSON.parse(localStorage.getItem(CK) || "null");
        if(!d || typeof d !== "object") return null;
        if(typeof d.uid !== "string" || typeof d.key !== "string" || typeof d.issue !== "number" || typeof d.expireAt !== "number") return null;
        var n = NS();
        if(d.issue > n + SK) return null;
        if(n >= d.expireAt) return null;
        if(d.key !== "KEY-" + d.issue + "-" + KB(d.uid, d.issue)) return null;
        return d;
    }catch(e){ return null; }
}

function SC(d){ try{ localStorage.setItem(CK, JSON.stringify(d)); }catch(e){} }
function CC(){ try{ localStorage.removeItem(CK); }catch(e){} }

var kE = document.getElementById("key"),
    tE = document.getElementById("timer"),
    nE = document.getElementById("note"),
    cB = document.getElementById("copyBtn"),
    inArea = document.getElementById("inputArea"),
    mInp = document.getElementById("manualInput"),
    mBtn = document.getElementById("manualBtn"),
    tI = null, cK = "";

function ST(){ if(tI){ clearInterval(tI); tI = null; } }

function PR(k, ex){
    cK = k; 
    kE.textContent = k; 
    cB.style.display = "inline-block";
    inArea.style.display = "none";
    ST();
    var tk = function(){
        var l = ex - NS();
        if(l <= 0){
            tE.textContent = "KEY EXPIRED — get a new one in Roblox";
            tE.style.color = "#ff6e82";
            ST(); cB.style.display = "none"; CC(); return;
        }
        tE.textContent = "Time left: " + FM(l);
    };
    tk();
    tI = setInterval(tk, 1000);
}

function GN(u){
    var i = NS(), k = "KEY-" + i + "-" + KB(u, i), e = i + LF;
    SC({ uid: u, key: k, issue: i, expireAt: e });
    PR(k, e);
    nE.textContent = "Key for UID " + u + " generated! Paste into CHECK KEY in game.";
}

function askInput(){
    kE.textContent = "ACTION REQUIRED";
    kE.style.color = "#ffb478";
    tE.textContent = "";
    cB.style.display = "none";
    inArea.style.display = "block";
    nE.textContent = "Paste the link from GET KEY or enter your Roblox UserId below:";
}

// Извлечение параметров из URL
var urlParams = new URLSearchParams(location.search);
var rw = urlParams.get("uid");
if(!rw && location.hash){
    var hParams = new URLSearchParams(location.hash.substring(1));
    rw = hParams.get("uid");
}

var ud = EU(rw);
var ca = LC();

if(ud){
    if(ca && ca.uid === ud){
        PR(ca.key, ca.expireAt);
        nE.textContent = "Restored your live 8h key for UID " + ud + ".";
    }else{
        CC();
        GN(ud);
    }
}else{
    if(ca){
        PR(ca.key, ca.expireAt);
        nE.textContent = "Restored your active session on this device.";
    }else{
        askInput();
    }
}

// Кнопка разблокировки вручную
mBtn.addEventListener("click", function(){
    var val = mInp.value.trim();
    var manualUid = EU(val);
    if(manualUid){
        CC();
        GN(manualUid);
    }else{
        alert("Please enter a valid link from game or numeric Roblox UserId!");
    }
});

// Кнопка копирования ключа
cB.addEventListener("click", function(){
    if(!cK) return;
    var dn = function(o){
        if(o){
            cB.textContent = "COPIED!";
            setTimeout(function(){ cB.textContent = "COPY KEY"; }, 1500);
        }else{
            alert("Copy failed. Select key text manually.");
        }
    };
    
    var fb = function(){
        var ta = document.createElement("textarea");
        ta.value = cK;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "0";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = false;
        try{ ok = document.execCommand("copy"); }catch(e){}
        document.body.removeChild(ta);
        return ok;
    };

    if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(cK).then(function(){ dn(true); }, function(){ dn(fb()); });
    }else{
        dn(fb());
    }
});

window.addEventListener("beforeunload", ST);
window.addEventListener("pagehide", ST);
})();
</script>
</body>
</html>
